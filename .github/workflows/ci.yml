name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (P1.14); Dependabot updates them.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      # P1.14: registry signatures of every installed package.
      - run: npm audit signatures
      - run: npm run lint
      # P1.2: e2e targets the local echo-server only, never the internet.
      - name: No third-party targets in e2e
        run: "! grep -rnE 'jsonplaceholder|httpbin' e2e playwright.config.ts"
      - run: npm run test:scripts
      - run: npm run check:csp
      # P3.11: docs/postman-compatibility.md is what the compatibility matrix gives.
      - run: npm run check:compat
      # P1.11: no unused files, exports or dependencies.
      - run: npx knip

  claims:
    name: Claims ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # P1.4: every doc claim has a ledger row and a test titled @claim:<id>.
      # The claim tests themselves run in the retry-free claims-* projects
      # of the e2e job.
      - run: npm run check:claims
      # P7.6: the README's feature list is the ledger; every doc link leads to a file, and the README links every doc.
      - run: npm run check:readme
      - run: npm run check:links

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      # Vitest runs in real headless Chromium via the Playwright browser
      # provider (angular.json's "test" target), not jsdom - Web Workers,
      # IndexedDB, and WebCrypto all need a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci

  build:
    name: Build (production, budgets enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      # angular.json budgets fail the build above the P1.12 baseline x 1.10
      # (raw bytes); bundle:report does the same for gzip.
      - run: npm run build
      - run: npm run bundle:report
      # W2.2: every link of the site to itself leads to a page and an id it has.
      - run: npm run check:site-links
      # release.yml attaches this SBOM; it fails for a workspace with no version (v2.6.0's first tag).
      - run: npm sbom --sbom-format cyclonedx --omit dev > /dev/null
      # P1.7: build once. e2e and deploy.yml use exactly these files: dist/deploy is
      # what is served (the site, and the app under app/), dist/wayfarer/browser the
      # app's build, which tests read files of.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-report
          path: bundle-report.json
          retention-days: 14

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      # P5.2: a run's JUnit report is validated against the JUnit schema with xmllint, which this runner does not have.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libxml2-utils
      # packages/core (P2.1): no DOM types, Vitest in Node, lines >= 90%.
      - run: npm -w packages/core run typecheck
      - run: npm -w packages/core test
      # P3.10 (risk R3): what a real script costs in the engine. Fails above 300 ms (p95 of 20 runs) or a 250 ms engine load.
      - run: npm -w packages/core run bench

  cli:
    # P6.5: the command line, built and run against local servers, on both Node versions it supports.
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm -w packages/cli run typecheck
      - run: npm -w packages/cli test
      # P6.6: the tarball npm would publish, installed into an empty folder, runs.
      - name: Pack, install and run
        run: |
          npm pack --workspace packages/cli --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/wayfarer-cli-*.tgz
          npx --no-install wayfarer-cli --version

  local-bridge:
    name: Local Bridge (zero-dependency Node test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run bridge:test

  lighthouse:
    # P7.2: the built app, served as production serves it (headers,
    # compression), measured with Lighthouse's desktop preset: the median of
    # three runs scores 90 or more, LCP at most 2 s, TBT at most 200 ms.
    name: Lighthouse (desktop)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: npm ci
      # The Chromium the e2e suite pins: the runner's own Chrome gave Lighthouse no navigation start (NO_NAVSTART).
      - run: npx playwright install --with-deps chromium
      - name: Three runs against the build
        run: |
          export CHROME_PATH=$(node -p "require('playwright').chromium.executablePath()")
          node e2e/support/prod-server.mjs dist/deploy 4200 &
          until curl -sf -o /dev/null http://localhost:4200/app/; do sleep 1; done
          for run in 1 2 3; do
            # Pinned, and not a dependency of the project (as Newman is not, for the golden files). A run Lighthouse itself could not record is made again, once.
            for attempt in 1 2; do
              npx --yes lighthouse@12.8.2 http://localhost:4200/app/ --preset=desktop --output=json --output-path="$RUNNER_TEMP/lighthouse-$run.json" --chrome-flags="--headless=new --no-sandbox" --quiet && break
            done
          done
          node scripts/check-lighthouse.mjs "$RUNNER_TEMP"/lighthouse-*.json
          # The site at / (W2.1 of PLAN-design.md), on Lighthouse's mobile preset.
          for run in 1 2 3; do
            for attempt in 1 2; do
              npx --yes lighthouse@12.8.2 http://localhost:4200/ --output=json --output-path="$RUNNER_TEMP/site-$run.json" --chrome-flags="--headless=new --no-sandbox" --quiet && break
            done
          done
          node scripts/check-lighthouse.mjs --site "$RUNNER_TEMP"/site-*.json

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Serves the downloaded build through prod-server.mjs (production
      # headers). claims-<browser> runs the @claim tests with retries off.
      # PROD_SERVER_LOG: what the server received and answered, for a page.goto that hangs (#228).
      # Both uploads also run for a flake: its retry passes and the job is green, and a
      # trace.zip under test-results/ is what a failed first attempt leaves (retain-on-first-failure).
      - run: npx playwright test --project=${{ matrix.browser }} --project=claims-${{ matrix.browser }}
        env:
          CI: "1"
          PROD_SERVER_LOG: ${{ runner.temp }}/prod-server.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() || (!cancelled() && hashFiles('test-results/**/trace.zip') != '') }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() || (!cancelled() && hashFiles('test-results/**/trace.zip') != '') }}
        with:
          name: prod-server-log-${{ matrix.browser }}
          path: ${{ runner.temp }}/prod-server.log
          retention-days: 7
