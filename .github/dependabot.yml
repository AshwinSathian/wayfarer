version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # TypeScript moves with Angular: @angular/build 22 accepts >=6.0 <6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Node types match the Node the app is built and tested with (.nvmrc, 24): types of a later
      # major would accept APIs that Node 22 and 24, where the CLI and the bridge run, do not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init, analyze and upload-sarif are three parts of one release: alone, Dependabot opened three PRs (#353, #355, #356).
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "ci"
