name: Release

# P6.6: publishes the Local Bridge or the CLI to npm, from a tag:
#
#   git tag bridge-v2.2.0 && git push origin bridge-v2.2.0   -> wayfarer-bridge 2.2.0
#   git tag cli-v1.0.0    && git push origin cli-v1.0.0      -> wayfarer-cli 1.0.0
#
# P7.7: a tag of the app (v2.5.0) builds it and attaches to its GitHub
# release the built folder as a tarball, a CycloneDX SBOM of what ships and
# SHA256SUMS of both. A deploy stays a step of its own (deploy.yml).
#
# The tag's version must be the package's. The package's tests run, the
# tarball npm would publish is installed into an empty folder and run, and
# only then is it published, through npm's trusted publishing (OIDC): no
# token is stored, and npm attaches a provenance attestation of this run.
#
# The job that holds the OIDC token (id-token: write) runs no code of the
# package's dependencies: installing the tarball resolves them as a user's
# install would, unpinned and with their install scripts, so that is done in
# `pack`, which holds no token, and `publish` publishes the very tarball
# `pack` tested. The check from the registry runs without the token too.
# The trusted publisher (this repository, this workflow) is set on each
# package at npmjs.com first: docs/runbook.md, "The first release".

on:
  push:
    tags:
      - "bridge-v*"
      - "cli-v*"
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Pack and test ${{ github.ref_name }}
    # A tag of the app is the job `app`'s; publish and verify need pack, so they are skipped with it.
    if: ${{ !startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      bin: ${{ steps.package.outputs.bin }}
      check: ${{ steps.package.outputs.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Never a cache in a release build.
          package-manager-cache: false

      - name: Which package, and is the tag its version
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            bridge-v*) folder=packages/bridge; bin=wayfarer-bridge; check=--help ;;
            cli-v*) folder=packages/cli; bin=wayfarer-cli; check=--version ;;
            *) echo "::error::$TAG names no package"; exit 1 ;;
          esac
          name=$(node -p "require('./$folder/package.json').name")
          version=$(node -p "require('./$folder/package.json').version")
          if [ "${TAG#*-v}" != "$version" ]; then
            echo "::error::The tag says ${TAG#*-v}; $folder/package.json says $version."
            exit 1
          fi
          { echo "folder=$folder"; echo "name=$name"; echo "version=$version"; echo "bin=$bin"; echo "check=$check"; } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Test the Local Bridge
        if: steps.package.outputs.folder == 'packages/bridge'
        run: npm run bridge:test
      - name: Build and test the CLI
        if: steps.package.outputs.folder == 'packages/cli'
        run: |
          npm -w packages/cli run typecheck
          npm -w packages/cli test

      # The repository's licence goes into the tarball; npm adds a LICENSE file by itself.
      - run: cp LICENSE "$FOLDER/LICENSE"
        env:
          FOLDER: ${{ steps.package.outputs.folder }}

      - name: Pack, install the tarball into an empty folder and run it
        env:
          FOLDER: ${{ steps.package.outputs.folder }}
          BIN: ${{ steps.package.outputs.bin }}
          CHECK: ${{ steps.package.outputs.check }}
        run: |
          mkdir "$RUNNER_TEMP/tarball"
          npm pack --workspace "$FOLDER" --pack-destination "$RUNNER_TEMP/tarball"
          tarball=$(ls "$RUNNER_TEMP"/tarball/*.tgz)
          tar -tzf "$tarball"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$tarball"
          npx --no-install "$BIN" "$CHECK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ github.ref_name }}
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm's trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball
      # Trusted publishing needs npm 11.5.1 or later. Nothing is installed here: what is published is the tarball pack tested.
      - name: Publish the tarball pack tested
        run: |
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)" || { echo "::error::npm $(npm --version) cannot publish through OIDC"; exit 1; }
          npm publish "$(ls "$RUNNER_TEMP"/tarball/*.tgz)" --access public --provenance

  verify:
    name: npx finds ${{ github.ref_name }} on the registry
    needs: [pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: npx finds it on the registry
        env:
          NAME: ${{ needs.pack.outputs.name }}
          VERSION: ${{ needs.pack.outputs.version }}
          BIN: ${{ needs.pack.outputs.bin }}
          CHECK: ${{ needs.pack.outputs.check }}
        run: |
          cd "$RUNNER_TEMP" && mkdir registry && cd registry
          # The registry may take a moment to serve a new version.
          for attempt in 1 2 3 4 5 6; do
            if npx --yes --package "$NAME@$VERSION" "$BIN" "$CHECK"; then exit 0; fi
            sleep 20
          done
          exit 1

  app:
    name: Release ${{ github.ref_name }} (the app)
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Never a cache in a release build.
          package-manager-cache: false

      - name: The tag is the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The tag says ${TAG#v}; package.json says $version."
            exit 1
          fi

      - run: npm ci
      # The build carries this commit, which Settings → Diagnostics shows.
      - run: npm run build

      - name: The tarball, the SBOM and their checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          assets="$RUNNER_TEMP/assets" && mkdir "$assets"
          name="wayfarer-${TAG#v}"
          tar -czf "$assets/$name.tar.gz" -C dist/deploy .
          # What ships: the dependencies of the build, not the tools that make it.
          npm sbom --sbom-format cyclonedx --omit dev > "$assets/$name.cdx.json"
          cd "$assets" && sha256sum "$name.tar.gz" "$name.cdx.json" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: The release, with the changelog's section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section ## [${TAG#v}]"; exit 1; }
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Wayfarer $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
