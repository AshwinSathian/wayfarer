<!-- Unified method + URL bar -->
<div class="address-bar min-w-0 flex-[1_1_20rem]">
  <!-- Method: any HTTP method can be typed; the common ones are in the menu beside it. A WebSocket has none (U-047). -->
  @if (socket.isSocket()) {
  <span class="socket-scheme" aria-hidden="true">WS</span>
  } @else {
  <input
    class="font-mono method-field"
    uiInput
    #methodInput
    aria-label="HTTP method"
    maxlength="32"
    spellcheck="false"
    autocapitalize="characters"
    autocomplete="off"
    [value]="store.draft().method"
    (input)="onMethodInput(methodInput)"
  />
  <button
    uiButton="icon"
    class="btn-plain address-method method-menu"
    type="button"
    aria-label="Common methods"
    ngMenuTrigger
    #methodsTrigger="ngMenuTrigger"
    [menu]="methods.menu()"
    ><app-icon name="keyboard_arrow_down" class="icon-sm"
  /></button>
  <ui-menu #methods [trigger]="methodsTrigger" [items]="methodItems" />
  }

  <!-- URL input -->
  <input
    uiInput
    #urlInput
    type="url"
    class="address-url font-mono address-field"
    [ngModel]="store.draft().url"
    (ngModelChange)="store.setUrl($event)"
    (paste)="onPaste($event)"
    (keydown.enter)="onEnter($event)"
    aria-label="Address"
    [attr.aria-invalid]="store.endpointError() ? true : null"
    [attr.aria-describedby]="store.endpointError() ? 'address-error' : null"
    placeholder="Type an address, or paste a cURL command"
  />
</div>

<!-- Action buttons -->
<div class="flex shrink-0 items-center gap-2">
  <!--
    Disabled native buttons ignore an author-specified `cursor` in most
    browsers (the UA always paints the default arrow over a genuinely
    disabled control, regardless of CSS) — wrapping in a plain,
    non-disabled span is the standard way around that, and it also
    makes the tooltip's hover target unambiguous rather than relying on
    whether a given browser still dispatches hover events to a disabled
    element at all.
  -->
  <!-- A WebSocket is not a request cURL can send (U-047). -->
  @if (!socket.isSocket()) {
  <span
    class="curl-btn-wrap"
    [class.is-disabled]="!store.draft().url"
    [uiTooltip]="store.draft().url ? '' : 'Type an address to copy the request.'"
  >
    <button
      uiButton="outlined"
      type="button"
      [disabled]="!store.draft().url"
      [uiTooltip]="store.draft().url ? 'Copy as cURL' : ''"
      aria-label="Copy as cURL"
      ngMenuTrigger
      #curlTrigger="ngMenuTrigger"
      [softDisabled]="false"
      [menu]="curlMenu.menu()"
      class="btn-secondary btn-square curl-btn"
      ><app-icon name="terminal"
    /></button>
  </span>
  <ui-menu #curlMenu [trigger]="curlTrigger" [items]="curlItems" />
  }
  <button
    uiButton="outlined"
    class="btn-secondary btn-square"
    type="button"
    [disabled]="!store.draft().url"
    [attr.aria-disabled]="savingRequest() ? 'true' : null"
    [uiTooltip]="loadedCollectionRequest() ? 'Save' : 'Save to collection…'"
    [uiTooltipKeys]="shortcuts.save"
    [attr.aria-label]="loadedCollectionRequest() ? 'Save' : 'Save to collection…'"
    (click)="save()"
  >
    @if (savingRequest()) {
    <ui-spinner />
    } @else {
    <app-icon name="save" />
    }
  </button>
  <!-- One button each, whose label and action change: a button swapped for another took focus with it. -->
  @if (socket.isSocket()) {
  <!-- An address of a WebSocket (P5.7): it is connected to, not sent. Its state is beside it (U-048). -->
  <span class="socket-state type-footnote" aria-hidden="true" [class.text-status-success]="socketStatus() === 'open'"
    >{{ socketStatus() === 'connecting' ? 'Connecting…' : socketStatus() === 'open' ? 'Connected' : 'Not connected'
    }}</span
  >
  <button
    uiButton="filled"
    type="button"
    class="send-btn"
    (click)="socketStatus() === 'closed' ? socket.connect() : socket.disconnect()"
    >{{ socketStatus() === 'closed' ? "Connect" : "Disconnect" }}</button
  >
  } @else {
  <button
    uiButton="filled"
    type="button"
    [disabled]="!store.loadingState() && !store.draft().url"
    [attr.aria-label]="store.loadingState() ? 'Cancel request' : 'Send request'"
    [uiTooltip]="store.loadingState() ? '' : 'Send request'"
    [uiTooltipKeys]="shortcuts.send"
    (click)="sendOrCancel($event)"
    class="send-btn"
    >{{ store.loadingState() ? "Cancel" : "Send" }}</button
  >
  }
</div>

<!-- What the last copy did (U-050). The live region is always in the page, out of the flow, so that a screen
     reader hears it change; the note is drawn while it has text: an empty line of the row would keep its gap. -->
<span class="sr-only" role="status">{{ copyStatus.text() }}</span>
@if (copyStatus.text()) {
<p class="copy-note basis-full type-footnote text-label-secondary -mt-1" aria-hidden="true">{{ copyStatus.text() }}</p>
}
