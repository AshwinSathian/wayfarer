<!-- Unified method + URL bar -->
<div class="address-bar min-w-0 flex-[1_1_20rem]">
  <!-- Method: any HTTP method can be typed; the common ones are in the menu beside it. -->
  <mat-form-field class="field method-field">
    <input class="font-mono" matInput
      #methodInput
      aria-label="HTTP method"
      maxlength="32"
      spellcheck="false"
      autocapitalize="characters"
      autocomplete="off"
      [value]="store.draft().method"
      (input)="onMethodInput(methodInput)"
     />
  </mat-form-field>
  <button
    matIconButton class="btn-plain address-method method-menu"
    type="button"
    aria-label="Common methods"
    ngMenuTrigger
    #methodsTrigger="ngMenuTrigger"
    [menu]="methods.menu()"
  ><app-icon name="keyboard_arrow_down" class="icon-sm" /></button>
  <ui-menu #methods [trigger]="methodsTrigger" [items]="methodItems" />

  <!-- URL input -->
  <mat-form-field class="field address-field">
    <input matInput
      #urlInput
      type="url"
      class="address-url font-mono"
      [ngModel]="store.draft().url"
      (ngModelChange)="store.setUrl($event)"
      (paste)="onPaste($event)"
      placeholder="https://api.example.com/v1/endpoint, or paste a cURL command"
     />
  </mat-form-field>
</div>

<!-- Action buttons -->
<div class="flex shrink-0 items-center gap-2">
  <button
    matButton="outlined" class="btn-secondary btn-square"
    type="button"
    uiTooltip="New request"
    aria-label="New request"
    (click)="view.clear()"
  ><app-icon name="add" /></button>
  <!--
    Disabled native buttons ignore an author-specified `cursor` in most
    browsers (the UA always paints the default arrow over a genuinely
    disabled control, regardless of CSS) — wrapping in a plain,
    non-disabled span is the standard way around that, and it also
    makes the tooltip's hover target unambiguous rather than relying on
    whether a given browser still dispatches hover events to a disabled
    element at all.
  -->
  <span
    class="curl-btn-wrap"
    [class.is-disabled]="!store.draft().url"
    [uiTooltip]="store.draft().url ? '' : 'Enter a URL first to copy as cURL'"
  >
    <button
      matButton="outlined"
      type="button"
      [disabled]="!store.draft().url"
      [uiTooltip]="store.draft().url ? 'Copy as cURL' : ''"
      aria-label="Copy as cURL"
      ngMenuTrigger
      #curlTrigger="ngMenuTrigger"
      [softDisabled]="false"
      [menu]="curlMenu.menu()"
      class="btn-secondary btn-square curl-btn"
    ><app-icon name="terminal" /></button>
  </span>
  <ui-menu #curlMenu [trigger]="curlTrigger" [items]="curlItems" />
  <button
    matButton="outlined" class="btn-secondary btn-square"
    type="button"
    [disabled]="!store.draft().url || savingRequest()"
    [uiTooltip]="loadedCollectionRequest() ? 'Save' : 'Save to Collection'"
    [attr.aria-label]="loadedCollectionRequest() ? 'Save' : 'Save to Collection'"
    (click)="save()"
  >
    @if (savingRequest()) {
    <ui-spinner />
    } @else {
    <app-icon name="save" />
    }
  </button>
  <!-- One button each, whose label and action change: a button swapped for another took focus with it. -->
  @if (socket.isSocket()) {
  <!-- An address of a WebSocket (P5.7): it is connected to, not sent. -->
  <button matButton="filled" type="button" class="send-btn" (click)="socketStatus() === 'closed' ? socket.connect() : socket.disconnect()">{{ socketStatus() === 'closed' ? "Connect" : "Disconnect" }}</button>
  } @else {
  <button
    matButton="filled"
    type="button"
    [disabled]="!store.loadingState() && !store.draft().url"
    [attr.aria-label]="store.loadingState() ? 'Cancel request' : 'Send request'"
    (click)="store.loadingState() ? store.cancel() : send.emit()"
    class="send-btn"
  >{{ store.loadingState() ? "Cancel" : "Send" }}</button>
  }
</div>
