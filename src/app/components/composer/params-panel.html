<!-- The rows editor wraps a row by its own room (U-155): a grid by the window's width left the key and value 20 px
     each beside the tree at 200% text. -->
<app-rows-editor
  noun="parameter"
  [items]="store.draft().params"
  addLabel="Add parameter"
  (itemChange)="store.paramsEdited()"
  (add)="store.addParam()"
  (remove)="store.removeParam($event)"
></app-rows-editor>
