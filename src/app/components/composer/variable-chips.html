@for (token of store.variableTokens(); track token.field + token.key) {
<div
  class="var-chip var-{{ token.source === 'missing' ? 'missing' : token.source === 'environment' ? 'environment' : 'request' }}"
  role="button"
  tabindex="0"
  [uiTooltip]="token.source === 'environment' ? 'Show ' + token.key + ' in its environment.' : ''"
  (click)="handleVariableChipClick(token)"
  (keydown.enter)="handleVariableChipClick(token)"
  (keydown.space)="$event.preventDefault(); handleVariableChipClick(token)"
>
  <div class="flex items-center gap-1.5">
    <span class="type-footnote font-semibold">{{ token.key }}</span>
    <span class="type-footnote text-label-tertiary capitalize">{{ token.source }}</span>
  </div>
  <div class="type-footnote text-label-secondary mt-0.5">
    {{ token.error ?? token.value ?? (token.source === 'dynamic' ? 'New value each send' : token.source === 'secret' ||
    token.vaulted ? 'From the vault' : 'Not resolved') }}
  </div>
</div>
}
