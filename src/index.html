<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Wayfarer API client</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The canvas (--canvas-app) of each theme; theme.js and Theme set both to the theme drawn (D4.13, U-088). -->
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Open Wayfarer, an API client that runs in your browser. No install and no account; your requests and collections stay on this device."
    />
    <!-- The card a link to the app makes in a chat or a feed: the landing's (packages/site/social-images.mjs). A
         crawler needs absolute addresses; a self-hosted copy may point these at its own host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wayfarer" />
    <meta property="og:title" content="Wayfarer: the API client that opens in a tab" />
    <meta
      property="og:description"
      content="An API client that runs in your browser. No install and no account; your requests and collections stay on this device."
    />
    <meta property="og:url" content="https://wayfarer.ashwinsathian.com/app/" />
    <meta property="og:image" content="https://wayfarer.ashwinsathian.com/og/index.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Content-Security-Policy, generated from security/csp.json by
      `npm run gen:csp` (do not edit by hand; `npm run check:csp` fails CI on
      drift). The rationale for each directive is in that file. The same
      policy is sent as an HTTP header via packages/site/public/_headers (the
      rule for /app/*), which also carries frame-ancestors (a <meta> policy
      can't).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src blob:; manifest-src 'self'; require-trusted-types-for 'script'"
    />
    <!-- The theme, before anything is drawn (F85). Not a module and not deferred: it must run before the body. -->
    <script src="theme.js"></script>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root>
      <!-- The splash (src/design-system/splash.css): the shell in skeleton from the first frame, until Angular starts
           and replaces it. The mark is app-mark's. If the app does not start, main.ts says so here. -->
      <div class="splash safe-area" role="status" aria-busy="true" aria-label="Loading Wayfarer">
        <div class="splash-sidebar" aria-hidden="true">
          <div class="splash-sidebar-head">
            <svg class="brand-mark" viewBox="0 0 26 26" focusable="false">
              <rect class="brand-mark-tile" width="26" height="26" rx="6" />
              <g class="brand-mark-glyph">
                <path
                  d="M5.1 9.2L8.3 18.3L11.9 11.2L15.5 18.3L18.1 12.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle cx="19.1" cy="9.4" r="3" fill="currentColor" />
              </g>
            </svg>
            <span class="type-title-3 splash-name">Wayfarer</span>
          </div>
          <div class="splash-sidebar-body">
            <span class="ui-skeleton splash-line splash-short"></span>
            <span class="ui-skeleton splash-line"></span>
            <span class="ui-skeleton splash-line splash-short"></span>
          </div>
        </div>
        <div class="splash-main" aria-hidden="true">
          <div class="splash-toolbar">
            <div class="splash-cluster">
              <span class="ui-skeleton splash-icon"></span>
              <svg class="brand-mark" viewBox="0 0 26 26" focusable="false">
                <rect class="brand-mark-tile" width="26" height="26" rx="6" />
                <g class="brand-mark-glyph">
                  <path
                    d="M5.1 9.2L8.3 18.3L11.9 11.2L15.5 18.3L18.1 12.4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle cx="19.1" cy="9.4" r="3" fill="currentColor" />
                </g>
              </svg>
              <span class="type-title-3 splash-name">Wayfarer</span>
            </div>
            <span class="ui-skeleton splash-palette"></span>
            <div class="splash-cluster">
              <span class="ui-skeleton splash-control"></span>
              <span class="ui-skeleton splash-control splash-wide-only"></span>
              <span class="ui-skeleton splash-icon"></span>
              <span class="ui-skeleton splash-icon"></span>
            </div>
          </div>
          <div class="splash-composer">
            <span class="ui-skeleton splash-tab"></span>
            <div class="splash-address">
              <span class="ui-skeleton splash-url"></span>
              <span class="ui-skeleton splash-send"></span>
            </div>
            <div class="splash-sections">
              <span class="ui-skeleton splash-word"></span>
              <span class="ui-skeleton splash-word"></span>
              <span class="ui-skeleton splash-word"></span>
              <span class="ui-skeleton splash-word splash-wide-only"></span>
            </div>
            <span class="ui-skeleton splash-field"></span>
          </div>
          <div class="splash-status"></div>
        </div>
      </div>
    </app-root>
    <noscript>Wayfarer is an API client that runs in your browser, and it needs JavaScript to run.</noscript>
  </body>
</html>
