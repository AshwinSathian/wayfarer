<!-- Pre-request script -->
<div class="space-y-2">
  <div class="flex items-center gap-2">
    <app-icon name="play_arrow" class="icon-sm text-label-tertiary" />
    <div class="ds-section-label">Pre-request Script</div>
  </div>
  <p class="type-caption text-label-tertiary">
    Runs before the request. Use <code class="font-mono text-accent-text">pm.environment.set(key, value)</code> to set variables.
  </p>
  <app-script-editor
    name="preScript"
    [ngModel]="store.draft().scripts.pre"
    (ngModelChange)="setScript('pre', $event)"
    [ngModelOptions]="{ standalone: true }"
    [height]="200"
  ></app-script-editor>
</div>

<!-- Post-response script -->
<div class="space-y-2">
  <div class="flex items-center gap-2">
    <app-icon name="replay" class="icon-sm text-label-tertiary" />
    <div class="ds-section-label">Post-response Script</div>
  </div>
  <p class="type-caption text-label-tertiary">
    Runs after the response. Use <code class="font-mono text-accent-text">pm.test(name, fn)</code> and <code class="font-mono text-accent-text">pm.expect(value)</code> for assertions.
  </p>
  <app-script-editor
    name="postScript"
    [ngModel]="store.draft().scripts.post"
    (ngModelChange)="setScript('post', $event)"
    [ngModelOptions]="{ standalone: true }"
    [height]="200"
  ></app-script-editor>
</div>

<!-- Visual test assertions -->
<app-tests-panel class="block space-y-3" />
