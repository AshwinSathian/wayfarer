<div class="flex justify-end pb-2">
  <button uiButton class="btn-sm" type="button" [attr.aria-pressed]="bulk()" (click)="toggleBulk()">
    {{ bulk() ? "Edit as rows" : "Edit as text" }}
  </button>
</div>
@if (bulk()) {
<label class="ds-form-label" for="headers-bulk"
  >Headers, one <code>Name: value</code> per line. Start a line with <code>#</code> to keep it without sending
  it.</label
>
<textarea
  uiInput
  id="headers-bulk"
  class="font-mono w-full"
  rows="8"
  spellcheck="false"
  [value]="bulkText()"
  (input)="onBulkInput($any($event.target).value)"
></textarea>
} @else {
<app-rows-editor
  context="Headers"
  [items]="store.draft().headers"
  addLabel="Add header"
  (itemChange)="store.headersEdited()"
  (add)="store.addHeader()"
  (remove)="store.removeHeader($event)"
></app-rows-editor>
}
