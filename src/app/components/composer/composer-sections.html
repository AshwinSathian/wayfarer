<div uiAccordion>
  <div class="sections-item">
    <button
      ngAccordionTrigger
      #paramsTrigger="ngAccordionTrigger"
      class="section-header"
      [panel]="paramsSection"
      [expanded]="view.mobileActivePanels() === 'params'"
      (expandedChange)="$event ? view.onMobileIndexChange('params') : view.onMobilePanelClosed('params', paramsTrigger)"
      ><span>Params <app-tab-mark [mark]="view.tabMarks().params" /></span
      ><app-icon class="section-chevron" name="keyboard_arrow_down"
    /></button>
    <div
      ngAccordionPanel
      uiAccordionPanel
      #paramsSection="ngAccordionPanel"
      class="section-body"
      [preserveContent]="true"
    >
      <ng-template ngAccordionContent>
        <app-params-panel class="flex flex-col gap-2" />
      </ng-template>
    </div>
  </div>
  <div class="sections-item">
    <button
      ngAccordionTrigger
      #headersTrigger="ngAccordionTrigger"
      class="section-header"
      [panel]="headersSection"
      [expanded]="view.mobileActivePanels() === 'headers'"
      (expandedChange)="$event ? view.onMobileIndexChange('headers') : view.onMobilePanelClosed('headers', headersTrigger)"
      ><span>Headers <app-tab-mark [mark]="view.tabMarks().headers" /></span
      ><app-icon class="section-chevron" name="keyboard_arrow_down"
    /></button>
    <div
      ngAccordionPanel
      uiAccordionPanel
      #headersSection="ngAccordionPanel"
      class="section-body"
      [preserveContent]="true"
    >
      <ng-template ngAccordionContent>
        <app-headers-panel class="block" />
      </ng-template>
    </div>
  </div>
  <div class="sections-item">
    <button
      ngAccordionTrigger
      #bodyTrigger="ngAccordionTrigger"
      class="section-header"
      [panel]="bodySection"
      [expanded]="view.mobileActivePanels() === 'body'"
      (expandedChange)="$event ? view.onMobileIndexChange('body') : view.onMobilePanelClosed('body', bodyTrigger)"
      ><span>Body <app-tab-mark [mark]="view.tabMarks().body" /></span
      ><app-icon class="section-chevron" name="keyboard_arrow_down"
    /></button>
    <div
      ngAccordionPanel
      uiAccordionPanel
      #bodySection="ngAccordionPanel"
      class="section-body"
      [preserveContent]="true"
    >
      <ng-template ngAccordionContent>
        <app-body-panel class="block" />
      </ng-template>
    </div>
  </div>
  <div class="sections-item">
    <button
      ngAccordionTrigger
      #authTrigger="ngAccordionTrigger"
      class="section-header"
      [panel]="authSection"
      [expanded]="view.mobileActivePanels() === 'auth'"
      (expandedChange)="$event ? view.onMobileIndexChange('auth') : view.onMobilePanelClosed('auth', authTrigger)"
      ><span>Auth <app-tab-mark [mark]="view.tabMarks().auth" /></span
      ><app-icon class="section-chevron" name="keyboard_arrow_down"
    /></button>
    <div
      ngAccordionPanel
      uiAccordionPanel
      #authSection="ngAccordionPanel"
      class="section-body"
      [preserveContent]="true"
    >
      <ng-template ngAccordionContent>
        <app-auth-panel />
      </ng-template>
    </div>
  </div>
  <div class="sections-item">
    <button
      ngAccordionTrigger
      #scriptsTrigger="ngAccordionTrigger"
      class="section-header"
      [panel]="scriptsSection"
      [expanded]="view.mobileActivePanels() === 'scripts'"
      (expandedChange)="$event ? view.onMobileIndexChange('scripts') : view.onMobilePanelClosed('scripts', scriptsTrigger)"
      ><span>Scripts <app-tab-mark [mark]="view.tabMarks().scripts" /></span
      ><app-icon class="section-chevron" name="keyboard_arrow_down"
    /></button>
    <div
      ngAccordionPanel
      uiAccordionPanel
      #scriptsSection="ngAccordionPanel"
      class="section-body"
      [preserveContent]="true"
    >
      <ng-template ngAccordionContent>
        <!-- Its editors are Monaco: made when the section first opens, and kept (P7.2: at load they cost 300 ms of the main thread). -->
        @defer (when view.mobileActivePanels() === 'scripts') {
        <app-scripts-panel class="block space-y-6" />
        }
      </ng-template>
    </div>
  </div>
  <div class="sections-item">
    <button
      ngAccordionTrigger
      #settingsTrigger="ngAccordionTrigger"
      class="section-header"
      [panel]="settingsSection"
      [expanded]="view.mobileActivePanels() === 'settings'"
      (expandedChange)="$event ? view.onMobileIndexChange('settings') : view.onMobilePanelClosed('settings', settingsTrigger)"
      ><span>Network <app-tab-mark [mark]="view.tabMarks().settings" /></span
      ><app-icon class="section-chevron" name="keyboard_arrow_down"
    /></button>
    <div
      ngAccordionPanel
      uiAccordionPanel
      #settingsSection="ngAccordionPanel"
      class="section-body"
      [preserveContent]="true"
    >
      <ng-template ngAccordionContent>
        <app-browser-notes class="block space-y-4" />
      </ng-template>
    </div>
  </div>
</div>
