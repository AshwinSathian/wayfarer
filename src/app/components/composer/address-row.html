<!-- Unified method + URL bar -->
<div class="address-bar min-w-0 flex-[1_1_20rem]">
  <!-- Method: any HTTP method can be typed; the common ones are in the menu beside it. -->
  <mat-form-field class="field method-field">
    <input matInput
      #methodInput
      aria-label="HTTP method"
      maxlength="32"
      spellcheck="false"
      autocapitalize="characters"
      autocomplete="off"
      [value]="store.draft().method"
      (input)="onMethodInput(methodInput)"
     />
  </mat-form-field>
  <button
    matIconButton class="btn-plain address-method method-menu"
    type="button"
    aria-label="Common methods"
    [matMenuTriggerFor]="methods"
  ><app-icon name="keyboard_arrow_down" class="icon-sm" /></button>
  <mat-menu #methods="matMenu">
    @for (method of requestMethods; track method) {
    <button mat-menu-item type="button" (click)="view.onRequestMethodChange(method)">{{ method }}</button>
    }
  </mat-menu>

  <!-- URL input -->
  <mat-form-field class="field address-field">
    <input matInput
      #urlInput
      type="url"
      class="address-url"
      [ngModel]="store.draft().url"
      (ngModelChange)="store.setUrl($event)"
      placeholder="https://api.example.com/v1/endpoint"
     />
  </mat-form-field>
</div>

<!-- Action buttons -->
<div class="flex shrink-0 items-center gap-2">
  <button
    matButton="outlined" class="btn-secondary btn-square"
    type="button"
    title="New request"
    aria-label="New request"
    (click)="view.clear()"
  ><app-icon name="add" /></button>
  <!--
    Disabled native buttons ignore an author-specified `cursor` in most
    browsers (the UA always paints the default arrow over a genuinely
    disabled control, regardless of CSS) — wrapping in a plain,
    non-disabled span is the standard way around that, and it also
    makes the tooltip's hover target unambiguous rather than relying on
    whether a given browser still dispatches hover events to a disabled
    element at all.
  -->
  <span
    class="curl-btn-wrap"
    [class.is-disabled]="!store.draft().url"
    [matTooltip]="store.draft().url ? '' : 'Enter a URL first to copy as cURL'"
    matTooltipPosition="below"
  >
    <button
      matButton="outlined"
      type="button"
      [disabled]="!store.draft().url"
      matTooltip="Copy as cURL"
      matTooltipPosition="below"
      [matTooltipDisabled]="!store.draft().url"
      aria-label="Copy as cURL"
      [matMenuTriggerFor]="curlMenu"
      class="btn-secondary btn-square curl-btn"
    ><app-icon name="terminal" /></button>
  </span>
  <!-- Credentials are masked unless asked for; a vault secret's reference stays as written. -->
  <mat-menu #curlMenu="matMenu">
    <button mat-menu-item type="button" (click)="store.copyAsCurl()">Copy as cURL</button>
    <button mat-menu-item type="button" (click)="store.copyAsCurl({ credentials: true })">Copy as cURL with credentials</button>
    <!-- The same request as code, masked as the first cURL item is (P4.6 a). -->
    <button mat-menu-item type="button" (click)="store.copyAsCode('fetch')">Copy as JavaScript (fetch)</button>
    <button mat-menu-item type="button" (click)="store.copyAsCode('python-requests')">Copy as Python (requests)</button>
    <button mat-menu-item type="button" (click)="store.copyAsCode('httpie')">Copy as HTTPie</button>
  </mat-menu>
  <button
    matButton="outlined" class="btn-secondary btn-square"
    type="button"
    [disabled]="!store.draft().url || savingRequest()"
    [title]="loadedCollectionRequest() ? 'Save' : 'Save to Collection'"
    [attr.aria-label]="loadedCollectionRequest() ? 'Save' : 'Save to Collection'"
    (click)="save()"
  >
    @if (savingRequest()) {
    <mat-spinner diameter="18" aria-hidden="true" />
    } @else {
    <app-icon name="save" />
    }
  </button>
  @if (store.loadingState()) {
  <button
    matButton="filled"
    type="button"
    aria-label="Cancel request"
    (click)="store.cancel()"
    class="send-btn"
  >Cancel</button>
  } @else {
  <button
    matButton="filled"
    type="button"
    [disabled]="!store.draft().url"
    aria-label="Send request"
    (click)="send.emit()"
    class="send-btn"
  >Send</button>
  }
</div>
