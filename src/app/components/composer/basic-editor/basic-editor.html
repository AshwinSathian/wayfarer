<div class="flex flex-col gap-2">
  <div class="hidden grid-cols-[1fr_1fr_auto] gap-4 px-2 md:grid">
    <div class="ds-section-label">Key</div>
    <div class="ds-section-label">Value</div>
    <div class="md:col-span-1 text-center"></div>
  </div>

  @for (item of items(); track item; let index = $index) {
  <div class="flex flex-col gap-3 md:grid md:grid-cols-[1fr_1fr_auto] md:items-center md:gap-4">
    <mat-form-field class="field w-full">
      <input matInput
        [disabled]="disableItem()(item, index)"
        [(ngModel)]="item.key"
        (ngModelChange)="itemChange.emit()"
        [attr.aria-label]="context() + ' name, row ' + (index + 1)"
       />
    </mat-form-field>
    @if (isStructured(item.value)) {
    <mat-form-field class="field w-full">
      <input matInput
        readonly
        [value]="asJson(item.value)"
        title="Nested value: edit it in JSON mode"
        [attr.aria-label]="context() + ' value, row ' + (index + 1) + ' (read-only, edit in JSON mode)'"
       />
    </mat-form-field>
    } @else {
    <mat-form-field class="field w-full">
      <input matInput
        [disabled]="disableItem()(item, index)"
        [(ngModel)]="item.value"
        (ngModelChange)="itemChange.emit()"
        [attr.aria-label]="context() + ' value, row ' + (index + 1)"
       />
    </mat-form-field>
    }
    <div class="flex justify-end md:block md:text-center">
      <button
        matIconButton class="btn-danger"
        type="button"
        [disabled]="disableItem()(item, index)"
        [attr.aria-label]="'Remove ' + context().toLowerCase() + ' item'"
        (click)="removeItem()(index, context())"
      ><app-icon name="close" /></button>
    </div>
  </div>
  }

  <div class="pt-2">
    <button
      matButton="filled" class="btn-secondary"
      type="button"
      [attr.aria-label]="addLabel()"
      [disabled]="isAddDisabled()(context())"
      (click)="addItem()(context())"
    ><app-icon name="add" /> {{ addLabel() }}</button>
  </div>
</div>
