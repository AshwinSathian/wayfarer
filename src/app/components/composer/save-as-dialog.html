<!-- Save to collection dialog -->
<ui-dialog
  header="Save to collection"
  [visible]="requestSave.saveAsDialogVisible()"
  (visibleChange)="requestSave.saveAsDialogVisible.set($event)"
  dismissableMask
  width="420px"
>
  <div class="flex flex-col gap-4">
    @if (!requestSave.saveAsCollectionOptions().length) {
    <p class="type-callout text-label-secondary">
      A request is saved into a collection, and there is none yet. Make one with New collection in the sidebar.
    </p>
    } @else {
    <div class="flex flex-col gap-1.5">
      <label for="save-as-name" class="type-footnote text-label-secondary">Name</label>
      <input
        class="font-sans w-full"
        uiInput
        cdkFocusInitial
        id="save-as-name"
        type="text"
        [ngModel]="requestSave.saveAsName()"
        (ngModelChange)="requestSave.saveAsName.set($event)"
        placeholder="Request name"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <span id="save-as-collection-label" class="type-footnote text-label-secondary">Collection</span>
      <ui-select
        class="w-full"
        id="save-as-collection"
        aria-labelledby="save-as-collection-label"
        placeholder="Choose a collection"
        [options]="requestSave.saveAsCollectionOptions()"
        [value]="requestSave.saveAsCollectionId()"
        (valueChange)="requestSave.onSaveAsCollectionChange($event)"
      />
    </div>
    @if (requestSave.saveAsFolderOptions().length) {
    <div class="flex flex-col gap-1.5">
      <span id="save-as-folder-label" class="type-footnote text-label-secondary">Folder (optional)</span>
      <ui-select
        class="w-full"
        id="save-as-folder"
        aria-labelledby="save-as-folder-label"
        [options]="folderOptions()"
        [value]="requestSave.saveAsFolderId()"
        (valueChange)="requestSave.saveAsFolderId.set($event)"
      />
    </div>
    } }

    <div class="flex justify-end gap-2">
      <button uiButton="outlined" class="btn-secondary" aria-label="Cancel" (click)="requestSave.closeSaveAsDialog()"
        >Cancel</button
      >
      <button
        uiButton="filled"
        aria-label="Save"
        [disabled]="requestSave.isSaveAsDisabled || requestSave.savingRequest()"
        (click)="confirm()"
        >{{ requestSave.savingRequest() ? 'Saving…' : 'Save' }}</button
      >
    </div>
  </div>
</ui-dialog>
