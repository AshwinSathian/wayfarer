<div
  uiTabList
  class="request-tabs"
  [selectedTab]="tabs.active().id"
  (selectedTabChange)="tabs.activate($event)"
  aria-label="Open requests"
>
  @for (tab of tabs.tabs(); track tab.id) {
  <button ngTab type="button" [value]="tab.id">
    <span class="request-tab-method">{{ tab.run ? "RUN" : isSocket(tab) ? "WS" : tab.draft().method }}</span>
    <span class="request-tab-name">{{ label(tab) }}</span>
    @if (tab.dirty()) {
    <span class="request-tab-unsaved" role="img" aria-label="Unsaved changes"></span>
    }
  </button>
  }
</div>
<!-- Every tab has its panel: the open one's is the composer, the others' are empty and hidden. -->
@for (tab of tabs.tabs(); track tab.id) { @if (tab !== tabs.active()) {
<div ngTabPanel class="tab-pane" [value]="tab.id"><ng-template ngTabContent /></div>
} }
<div class="flex items-center">
  <button
    uiButton="icon"
    class="btn-plain"
    type="button"
    aria-label="New tab"
    uiTooltip="New tab (Alt+T)"
    (click)="open()"
    ><app-icon name="add"
  /></button>
  <button
    uiButton="icon"
    class="btn-plain"
    type="button"
    aria-label="Duplicate tab"
    uiTooltip="Duplicate tab"
    (click)="duplicate()"
    ><app-icon name="content_copy"
  /></button>
  <button
    uiButton="icon"
    class="btn-plain"
    type="button"
    aria-label="Close tab"
    uiTooltip="Close tab (Alt+W)"
    (click)="close()"
    ><app-icon name="close"
  /></button>
</div>
