<div mat-tab-nav-bar class="tab-bar request-tabs" [tabPanel]="panel()" [mat-stretch-tabs]="false" disablePagination aria-label="Open requests">
  @for (tab of tabs.tabs(); track tab.id) {
  <button
    mat-tab-link
    type="button"
    [active]="tab === tabs.active()"
    (click)="tabs.activate(tab.id)"
    (focus)="tabs.activate(tab.id)"
  >
    <span class="request-tab-method">{{ tab.run ? "RUN" : tab.draft().method }}</span>
    <span class="request-tab-name">{{ label(tab) }}</span>
    @if (tab.dirty()) {
    <span class="request-tab-unsaved" role="img" aria-label="Unsaved changes"></span>
    }
  </button>
  }
</div>
<div class="flex items-center">
  <button matIconButton class="btn-plain" type="button" aria-label="New tab" matTooltip="New tab (Alt+T)" (click)="open()"><app-icon name="add" /></button>
  <button matIconButton class="btn-plain" type="button" aria-label="Duplicate tab" matTooltip="Duplicate tab" (click)="duplicate()"><app-icon name="content_copy" /></button>
  <button matIconButton class="btn-plain" type="button" aria-label="Close tab" matTooltip="Close tab (Alt+W)" (click)="close()"><app-icon name="close" /></button>
</div>
