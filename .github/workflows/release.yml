name: Release

# P6.6: publishes the Local Bridge or the CLI to npm, from a tag:
#
#   git tag bridge-v2.2.0 && git push origin bridge-v2.2.0   -> wayfarer-bridge 2.2.0
#   git tag cli-v1.0.0    && git push origin cli-v1.0.0      -> wayfarer-cli 1.0.0
#
# The tag's version must be the package's. The package's tests run, the
# tarball npm would publish is installed into an empty folder and run, and
# only then is it published, through npm's trusted publishing (OIDC): no
# token is stored, and npm attaches a provenance attestation of this run.
# The trusted publisher (this repository, this workflow) is set on each
# package at npmjs.com first: docs/runbook.md, "The first release".

on:
  push:
    tags:
      - "bridge-v*"
      - "cli-v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm's trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          # Never a cache in a release build.
          package-manager-cache: false

      - name: Which package, and is the tag its version
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            bridge-v*) folder=packages/bridge; bin=wayfarer-bridge; check=--help ;;
            cli-v*) folder=packages/cli; bin=wayfarer-cli; check=--version ;;
            *) echo "::error::$TAG names no package"; exit 1 ;;
          esac
          name=$(node -p "require('./$folder/package.json').name")
          version=$(node -p "require('./$folder/package.json').version")
          if [ "${TAG#*-v}" != "$version" ]; then
            echo "::error::The tag says ${TAG#*-v}; $folder/package.json says $version."
            exit 1
          fi
          # Trusted publishing needs npm 11.5.1 or later.
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)" || { echo "::error::npm $(npm --version) cannot publish through OIDC"; exit 1; }
          { echo "folder=$folder"; echo "name=$name"; echo "version=$version"; echo "bin=$bin"; echo "check=$check"; } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Test the Local Bridge
        if: steps.package.outputs.folder == 'packages/bridge'
        run: npm run bridge:test
      - name: Build and test the CLI
        if: steps.package.outputs.folder == 'packages/cli'
        run: |
          npm -w packages/cli run typecheck
          npm -w packages/cli test

      # The repository's licence goes into the tarball; npm adds a LICENSE file by itself.
      - run: cp LICENSE "$FOLDER/LICENSE"
        env:
          FOLDER: ${{ steps.package.outputs.folder }}

      - name: Install the tarball into an empty folder and run it
        env:
          FOLDER: ${{ steps.package.outputs.folder }}
          BIN: ${{ steps.package.outputs.bin }}
          CHECK: ${{ steps.package.outputs.check }}
        run: |
          npm pack --workspace "$FOLDER" --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/*.tgz)
          tar -tzf "$tarball"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$tarball"
          npx --no-install "$BIN" "$CHECK"

      - name: Publish
        env:
          FOLDER: ${{ steps.package.outputs.folder }}
        run: npm publish --workspace "$FOLDER" --access public --provenance

      - name: npx finds it on the registry
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          BIN: ${{ steps.package.outputs.bin }}
          CHECK: ${{ steps.package.outputs.check }}
        run: |
          cd "$RUNNER_TEMP" && mkdir registry && cd registry
          # The registry may take a moment to serve a new version.
          for attempt in 1 2 3 4 5 6; do
            if npx --yes --package "$NAME@$VERSION" "$BIN" "$CHECK"; then exit 0; fi
            sleep 20
          done
          exit 1
