<div class="request-tabs-row">
  <div
    uiTabList
    class="request-tabs"
    [selectedTab]="tabs.active().id"
    (selectedTabChange)="tabs.activate($event)"
    aria-label="Open requests"
  >
    @for (tab of tabs.tabs(); track tab.id) {
    <button
      ngTab
      type="button"
      [value]="tab.id"
      (contextmenu)="menuFor(tab, $event)"
      (keydown)="tabKey(tab, $event)"
      (dblclick)="rename(tab)"
    >
      @if (tab.holder; as holder) {
      <!-- A collection's or a folder's settings: its glyph, as the tree draws it, not a word (L-24). -->
      <app-icon
        [name]="holder.folderId ? 'folder' : 'folder_open'"
        class="request-tab-glyph icon-xs"
        role="img"
        [attr.aria-label]="holder.folderId ? 'Folder settings' : 'Collection settings'"
      />
      } @else {
      <span class="request-tab-method"
        >{{ tab.environments ? "Env" : tab.run ? "Run" : isSocket(tab) ? "WS" : tab.draft().method }}</span
      >
      }
      <span class="request-tab-name">{{ label(tab) }}</span>
      @if (tab.dirty()) {
      <span class="request-tab-unsaved" role="img" aria-label="Unsaved changes"></span>
      }
      <!-- The pointer's way to close a tab. Not a stop of its own: Alt+W, Delete and the menu close from the keyboard. -->
      <span class="request-tab-close" aria-hidden="true" (click)="closeFromPointer(tab, $event)"
        ><app-icon name="close" class="icon-xs"
      /></span>
    </button>
    }
  </div>
  @if (renaming(); as edit) {
  <!-- Over the tab it names: a field cannot be inside the tab's button. -->
  <input
    #renameField
    uiInput
    class="field-inline font-sans request-tab-rename"
    aria-label="Request name"
    [style.left.px]="edit.left"
    [style.width.px]="edit.width"
    [value]="edit.name"
    (keydown)="renameKey($event)"
    (blur)="commitRename($any($event.target).value)"
  />
  }
  <button
    uiButton="icon"
    class="btn-plain request-tab-new"
    type="button"
    aria-label="New tab"
    uiTooltip="New tab"
    [uiTooltipKeys]="shortcuts.newTab"
    (click)="open()"
    ><app-icon name="add"
  /></button>
</div>
<!-- Every tab has its panel: the open one's is the composer, the others' are empty and hidden. -->
@for (tab of tabs.tabs(); track tab.id) { @if (tab !== tabs.active()) {
<div ngTabPanel class="tab-pane" [value]="tab.id"><ng-template ngTabContent /></div>
} }
<ui-menu #menu [items]="menuItems()" />
