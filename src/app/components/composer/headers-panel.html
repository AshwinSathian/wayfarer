<div class="flex justify-end pb-2">
  <button matButton class="btn-sm" type="button" [attr.aria-pressed]="bulk()" (click)="toggleBulk()">
    {{ bulk() ? "Edit as rows" : "Bulk edit" }}
  </button>
</div>
@if (bulk()) {
<label class="ds-form-label" for="headers-bulk">Headers, one <code>Name: value</code> per line. Start a line with <code>#</code> to keep it without sending it.</label>
<mat-form-field class="field w-full">
  <textarea matInput
    id="headers-bulk"
    class="type-mono-body"
    rows="8"
    spellcheck="false"
    [value]="bulkText()"
    (input)="onBulkInput($any($event.target).value)"
  ></textarea>
</mat-form-field>
} @else {
<app-rows-editor
  context="Headers"
  [items]="store.draft().headers"
  addLabel="Add Header"
  (itemChange)="store.headersEdited()"
  (add)="store.addHeader()"
  (remove)="store.removeHeader($event)"
></app-rows-editor>
}
