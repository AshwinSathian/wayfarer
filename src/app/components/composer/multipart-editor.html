<div class="flex flex-col gap-2">
  @for (part of parts(); track part; let index = $index) {
  <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
    <input
      type="checkbox"
      uiCheckbox
      [attr.aria-label]="'Send part ' + (index + 1)"
      [(ngModel)]="part.enabled"
      (ngModelChange)="partChange.emit()"
    />
    <input
      class="font-mono min-w-0 flex-1 basis-32"
      uiInput
      placeholder="Name"
      [(ngModel)]="part.key"
      (ngModelChange)="partChange.emit()"
      [attr.aria-label]="'Part name, row ' + (index + 1)"
    />
    <ui-select
      class="w-24"
      [attr.aria-label]="'Part type, row ' + (index + 1)"
      [options]="kinds"
      [value]="part.kind"
      (valueChange)="kindChange.emit({ index, kind: $event })"
    />
    <!-- The value and its remove button wrap together: the button never stands on a line alone. -->
    <div class="flex min-w-0 flex-1 basis-56 items-center gap-2">
      @if (part.kind === 'text') {
      <input
        class="font-mono min-w-0 flex-1"
        uiInput
        placeholder="Value"
        [(ngModel)]="part.value"
        (ngModelChange)="partChange.emit()"
        [attr.aria-label]="'Part value, row ' + (index + 1)"
      />
      } @else {
      <ui-file
        class="min-w-0 flex-1"
        [label]="'File for part ' + (index + 1)"
        [fileName]="part.fileName"
        (picked)="filePicked.emit({ index, file: $event })"
        (cleared)="kindChange.emit({ index, kind: 'file' })"
      />
      }
      <button uiButton="icon" class="btn-plain" type="button" aria-label="Remove part" (click)="remove.emit(index)"
        ><app-icon name="close"
      /></button>
    </div>
  </div>
  }

  <div class="pt-2">
    <button uiButton="filled" class="btn-secondary" type="button" aria-label="Add part" (click)="add.emit()"
      ><app-icon name="add" /> Add part</button
    >
  </div>
</div>
