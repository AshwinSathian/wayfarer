<svg class="glyph-svg" viewBox="0 0 96 28" focusable="false">
  <line class="glyph-line" x1="14" y1="14" x2="82" y2="14" />
  @if (lit() === 0) {
  <circle class="glyph-ring" cx="14" cy="14" r="11" />
  } @else if (lit() === 1) {
  <rect class="glyph-ring" x="33" y="3" width="30" height="22" rx="4" />
  } @else if (lit() === 2) {
  <circle class="glyph-ring" cx="82" cy="14" r="12" />
  }
  <circle class="glyph-origin" cx="14" cy="14" r="6" />
  <rect class="glyph-block" x="38" y="8" width="20" height="12" rx="2" />
  <circle class="glyph-host" cx="82" cy="14" r="8" />
</svg>
